# Runs only the worker against the hosted Supabase project.
#   cp .env.worker.example .env.worker   # fill it in, never commit it
#   docker compose up -d --build
# See deploy/worker/README.md.
services:
  worker:
    build: ../../services/worker
    env_file: .env.worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - worker-work:/work
      # Uncomment after saving YouTube cookies next to this file (see README).
      # - ./cookies.txt:/secrets/cookies.txt:ro

volumes:
  worker-work:
