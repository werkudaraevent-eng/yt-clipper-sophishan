[project]
name = "clipper-worker"
version = "0.1.0"
description = "Background worker that turns YouTube videos into captioned 9:16 clips"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "psycopg[binary]>=3.2",
  "anthropic>=1.8",
  "httpx>=0.27",
  "yt-dlp>=2026.8.19",
  "numpy>=1.26",
  # OpenCV 5 moved the Haar cascades out of the wheel; YuNet needs >=4.8.
  "opencv-python-headless>=4.9,<5",
]

[project.optional-dependencies]
# Whisper transcription for videos without captions.
asr = [
  "faster-whisper>=1.1",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
clipper-worker = "clipper_worker.main:main"
clipper = "clipper_worker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipper_worker*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
